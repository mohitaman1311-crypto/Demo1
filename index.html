<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'/>
<title>Game Changer VIP Panel </title>
<link href='https://fonts.googleapis.com/css2?family=Shojumaru&family=Zen+Dots&family=Orbitron:wght@500;700;800;900&family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap' rel='stylesheet'>
<style>
:root {
    --lime:   #39ff14;
    --neon:   #00ff66;
    --mint:   #00ffcc;
    --white:  #ffffff;
    --dark:   #000805;
    --blood:  #dc143c;
    --blue:   #00aaff;
    --teal:   #00e0c0;
    /* Diamond palette */
    --dia1:   #e0f8ff;
    --dia2:   #a8f0e8;
    --dia3:   #60e8ff;
    --steel:  #b8bdd0;
    --steel2: #7880a0;
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100vh; overflow:hidden; background:transparent; }
body {
    font-family:'Rajdhani',system-ui,sans-serif;
    color:#fff; display:flex; align-items:center; justify-content:center; padding:5px;
}

/* ── BACKGROUND CANVAS ── */
#bgCanvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; }

/* ── LAUNCHER BUBBLE ── */
.launcher {
    position:absolute; top:10%; right:10px; width:54px; height:54px; border-radius:50%;
    background:radial-gradient(circle at 38% 28%, #004418 0%, #001108 55%, #000400 100%);
    border:2px solid #00ff88;
    box-shadow:
        0 0 20px #00ff88,
        0 0 45px rgba(0,255,140,0.75),
        0 0 80px rgba(0,200,80,0.35),
        inset 0 0 18px rgba(0,255,120,0.45),
        inset 0 1px 0 rgba(255,255,255,0.2);
    display:grid; place-items:center; cursor:pointer; z-index:90;
    animation:pulseRing 2s ease-in-out infinite;
}
.launcher::before {
    content:''; position:absolute; inset:-7px; border-radius:50%;
    border:1.5px dashed var(--neon); animation:spinA 6s linear infinite;
}
.launcher::after {
    content:''; position:absolute; inset:-13px; border-radius:50%;
    border:1px dashed rgba(57,255,20,0.4); animation:spinA 11s linear infinite reverse;
}
.launcher .lbl {
    font-family:'Shojumaru',cursive; font-size:6px; line-height:1;
    color:var(--lime); text-shadow:0 0 10px var(--lime); text-align:center; letter-spacing:0.5px;
}
.launcher .lbl small { display:block; font-size:4px; margin-top:2px; color:#fff; letter-spacing:1px; }
@keyframes pulseRing {
    0%,100% { box-shadow:0 0 14px var(--lime),0 0 28px rgba(57,255,20,0.5),inset 0 0 10px rgba(57,255,20,0.3); }
    50%      { box-shadow:0 0 26px var(--lime),0 0 52px rgba(57,255,20,0.9),inset 0 0 20px rgba(57,255,20,0.6); }
}
@keyframes spinA { to { transform:rotate(360deg); } }

/* ══════════════════════════════════════
   STAGE & PANEL  ─  9-point shield shape
══════════════════════════════════════ */
.stage {
    width:255px; position:relative; z-index:10; display:none;
    filter:
        drop-shadow(0 0 4px #001a08)
        drop-shadow(0 0 14px rgba(0,255,80,1))
        drop-shadow(0 0 32px rgba(0,200,100,0.75))
        drop-shadow(0 0 62px rgba(0,150,60,0.4))
        drop-shadow(0 2px 28px rgba(100,255,200,0.25));
}

.panel {
    position:relative;
    clip-path: polygon(
        13% 0%,   87% 0%,
        100% 8%,
        100% 86%,
        50% 100%,
        0%  86%,
        0%  8%
    );
    min-height:300px;
    background:
        linear-gradient(160deg,
            #000a02 0%,
            #010614 18%,
            #040118 38%,
            #010a05 58%,
            #060204 78%,
            #010c04 100%);
    overflow:hidden;
    padding:11px 14px 0 14px;
    display:flex; flex-direction:column;
}

/* Diamond shimmer overlay on panel */
.panel-diamond-shine {
    position:absolute; inset:0; pointer-events:none; z-index:0;
    background:
        radial-gradient(ellipse 60% 25% at 50% 0%,
            rgba(150,255,200,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 18% at 20% 30%,
            rgba(100,220,255,0.05) 0%, transparent 70%),
        radial-gradient(ellipse 35% 15% at 80% 60%,
            rgba(80,200,255,0.04) 0%, transparent 70%);
    animation: diaShine 7s ease-in-out infinite alternate;
}
@keyframes diaShine {
    0%   { opacity:0.6; transform:translateY(0px) scaleX(1); }
    50%  { opacity:1;   transform:translateY(-4px) scaleX(1.04); }
    100% { opacity:0.7; transform:translateY(2px) scaleX(0.98); }
}

/* Diamond sweep shimmer on top edge */
.panel::before {
    content:''; position:absolute; top:0; left:0; width:100%; height:3px;
    background:linear-gradient(90deg,transparent,rgba(180,255,220,0.4),var(--neon),#fff,var(--neon),rgba(180,255,220,0.4),transparent);
    animation:sweep 2.4s linear infinite; z-index:30;
    box-shadow:0 0 8px rgba(0,255,150,0.6), 0 0 20px rgba(0,255,150,0.3);
}
@keyframes sweep { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

/* SVG Shield Border - same 9 points, viewBox 0 0 100 100 */
.shield-svg-border {
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:40; overflow:visible;
}

/* Slash layer */
.slashLayer { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:3; }
.sk {
    position:absolute; height:2px; width:220%; left:-10%; opacity:0;
    background:linear-gradient(90deg,transparent,rgba(57,255,20,0.8),#fff,rgba(57,255,20,0.8),transparent);
    box-shadow:0 0 12px var(--lime),0 0 25px rgba(57,255,20,0.7);
    transform-origin:left center;
}
.sk:nth-child(1){top:22%;transform:rotate(-34deg);animation:slashGo 5s ease-out 0.0s infinite;}
.sk:nth-child(2){top:48%;transform:rotate(-28deg);animation:slashGo 5s ease-out 1.4s infinite;}
.sk:nth-child(3){top:70%;transform:rotate(-38deg);animation:slashGo 5s ease-out 2.8s infinite;}
.sk:nth-child(4){top:15%;transform:rotate(-22deg);animation:slashGo 5s ease-out 0.7s infinite;}
.sk:nth-child(5){top:85%;transform:rotate(-42deg);animation:slashGo 5s ease-out 3.5s infinite;}
@keyframes slashGo {
    0%  {opacity:0;transform:rotate(-34deg) translateX(-110%);}
    5%  {opacity:1;}
    28% {opacity:0;transform:rotate(-34deg) translateX(5%);}
    100%{opacity:0;}
}

#panelCanvas { position:absolute; inset:0; pointer-events:none; z-index:2; }

/* Aurora layer */
.aurora-layer { position:absolute; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
.ab { position:absolute; border-radius:60%; filter:blur(22px); mix-blend-mode:screen; opacity:0; will-change:transform,opacity; }
.ab1 { width:140%;height:55%;top:-18%;left:-20%;
    background:radial-gradient(ellipse at 50% 60%,rgba(0,255,160,0.45) 0%,rgba(57,255,20,0.28) 40%,transparent 70%);
    animation:aurora1 9s ease-in-out infinite; }
.ab2 { width:120%;height:50%;top:-8%;left:10%;
    background:radial-gradient(ellipse at 50% 50%,rgba(0,180,255,0.35) 0%,rgba(120,0,255,0.2) 45%,transparent 70%);
    animation:aurora2 12s ease-in-out infinite 2.5s; }
.ab3 { width:130%;height:45%;top:-5%;left:-10%;
    background:radial-gradient(ellipse at 50% 55%,rgba(255,160,0,0.2) 0%,rgba(57,255,20,0.18) 50%,transparent 72%);
    animation:aurora3 10s ease-in-out infinite 5s; }
.ab4 { width:90%;height:40%;top:2%;left:5%;
    background:radial-gradient(ellipse at 50% 50%,rgba(255,0,200,0.15) 0%,rgba(0,200,255,0.15) 50%,transparent 72%);
    animation:aurora4 14s ease-in-out infinite 1s; }
/* Extra colorful side glows */
.ab5 { width:60%;height:80%;top:10%;left:-15%;
    background:radial-gradient(ellipse at 80% 50%,rgba(0,255,200,0.12) 0%,rgba(0,120,255,0.08) 60%,transparent 80%);
    animation:aurora1 7s ease-in-out infinite 3s; }
.ab6 { width:60%;height:80%;top:10%;right:-15%;left:auto;
    background:radial-gradient(ellipse at 20% 50%,rgba(180,0,255,0.1) 0%,rgba(255,80,0,0.07) 60%,transparent 80%);
    animation:aurora2 8s ease-in-out infinite 1s; }
@keyframes aurora1{0%,100%{opacity:0;transform:translateY(0px) scaleX(1) rotate(-3deg);}20%{opacity:0.7;}50%{opacity:0.55;transform:translateY(-10px) scaleX(1.08) rotate(2deg);}80%{opacity:0.65;}}
@keyframes aurora2{0%,100%{opacity:0;transform:translateY(5px) scaleX(0.92) rotate(1deg);}30%{opacity:0.55;}55%{opacity:0.4;transform:translateY(-7px) scaleX(1.12) rotate(-2deg);}80%{opacity:0.38;}}
@keyframes aurora3{0%,100%{opacity:0;transform:translateY(-4px) scaleX(1.04) rotate(-2deg);}35%{opacity:0.5;}60%{opacity:0.35;transform:translateY(6px) scaleX(0.96) rotate(3deg);}}
@keyframes aurora4{0%,100%{opacity:0;transform:translateX(0px) scaleY(0.9);}40%{opacity:0.45;transform:translateX(12px) scaleY(1.1);}70%{opacity:0.3;transform:translateX(-8px) scaleY(1.0);}}

/* Slash impact flash */
.slash-impact { position:absolute; inset:0; pointer-events:none; z-index:20; opacity:0;
    background:linear-gradient(45deg,transparent 40%,rgba(255,0,0,0.12) 50%,transparent 60%); }
.slash-impact.go { animation:slashFlash 0.4s ease-out forwards; }
@keyframes slashFlash{0%{opacity:0;transform:translateX(-100%) rotate(-30deg);}20%{opacity:1;}100%{opacity:0;transform:translateX(100%) rotate(-30deg);}}

/* ══════════════════════════════════════
   HEADER
══════════════════════════════════════ */
.head {
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:8px; padding-bottom:7px;
    border-bottom:1px solid rgba(0,255,102,0.3);
    margin-bottom:7px; position:relative; z-index:5; flex-shrink:0;
}
.title {
    font-family:'Orbitron',sans-serif; font-size:12px; font-weight:800;
    letter-spacing:2px; color:#fff;
    text-shadow:
        0 0 6px #fff,
        0 0 14px var(--neon),
        0 0 28px rgba(0,255,110,0.65),
        0 0 55px rgba(0,255,80,0.3);
    line-height:1.2;
}
.ninja-tag {
    font-family:'Share Tech Mono',monospace; font-size:7px; letter-spacing:2px;
    color:var(--neon); text-shadow:0 0 6px var(--neon); margin-top:3px;
    animation:flicker 4s infinite;
}
@keyframes flicker{0%,94%,100%{opacity:1;}95%,97%{opacity:0.2;}96%,98%{opacity:0.8;}}

/* LIVE badge - top right */
.live-badge {
    display:flex; align-items:center; gap:5px;
    font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:2px;
    color:#afffcc; font-weight:700;
    border:1px solid rgba(0,255,100,0.9);
    border-top:1px solid rgba(255,255,255,0.55);
    border-left:1px solid rgba(200,255,220,0.35);
    padding:4px 9px;
    background:linear-gradient(135deg, rgba(0,20,10,0.9) 0%, rgba(0,40,20,0.7) 100%);
    white-space:nowrap; flex-shrink:0;
    box-shadow:
        0 0 12px rgba(0,255,100,0.45),
        0 0 28px rgba(0,255,80,0.2),
        inset 0 1px 0 rgba(200,255,220,0.15);
    text-shadow:0 0 8px #00ff88, 0 0 18px rgba(0,255,130,0.6);
}
.live-dot {
    width:7px; height:7px; border-radius:50%; background:#00ff88;
    box-shadow:0 0 8px #00ff88,0 0 16px #00ff88;
    animation:blink 1.4s ease-in-out infinite;
}
@keyframes blink{50%{opacity:0.3;transform:scale(0.7);}}

/* ══════════════════════════════════════
   RESULT SHOWCASE  (full redesign)
══════════════════════════════════════ */
#predWrap { display:flex; flex-direction:column; gap:0; flex:1; position:relative; z-index:5; }

.result-showcase {
    position:relative; flex:1;
    min-height:160px;
    background:
        radial-gradient(circle, rgba(0,220,110,0.06) 1px, transparent 1px),
        linear-gradient(160deg,
            #00080e 0%,
            #030514 28%,
            #020b04 58%,
            #050206 100%);
    background-size:18px 18px, 100% 100%;
    border:1px solid rgba(0,255,100,0.75);
    border-top:1.5px solid rgba(180,255,220,0.6);
    border-left:1px solid rgba(120,255,200,0.35);
    box-shadow:
        0 0 20px rgba(0,255,90,0.45),
        0 0 45px rgba(0,200,100,0.2),
        0 0 2px rgba(0,200,255,0.5),
        inset 0 0 28px rgba(0,12,6,0.95),
        inset 0 0 2px rgba(255,255,255,0.08),
        inset 0 1px 0 rgba(200,255,220,0.12);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:5px; padding:12px 10px 10px; overflow:hidden;
    margin-bottom:0;
}

/* Shuriken watermark - spinning behind number */
.shuriken-wm {
    position:absolute; width:115px; height:115px;
    opacity:0.13; pointer-events:none; z-index:0;
    animation:shurikenSpin 12s linear infinite;
}
@keyframes shurikenSpin { to { transform:rotate(360deg); } }

/* Shuriken watermark stops/flashes on rift trigger */
.shuriken-wm.rift-flash {
    animation:shurikenRift 0.6s ease-out forwards, shurikenSpin 12s linear infinite 0.6s;
    opacity:0.55;
}
@keyframes shurikenRift {
    0%  { transform:rotate(0deg) scale(1);   opacity:0.55; filter:brightness(1); }
    30% { transform:rotate(180deg) scale(1.6); opacity:0.9;  filter:brightness(3) hue-rotate(60deg); }
    60% { transform:rotate(300deg) scale(1.2); opacity:0.7;  filter:brightness(2); }
    100%{ transform:rotate(360deg) scale(1);   opacity:0.13; filter:brightness(1); }
}

/* Corner bracket decorations - all GREEN, no black fill */
.rc { position:absolute; width:18px; height:18px; z-index:25; background:transparent; }
.rc-tl { top:6px; left:6px; }
.rc-tr { top:6px; right:6px; }
.rc-bl { bottom:6px; left:6px; }
.rc-br { bottom:6px; right:6px; }

/* All corners: diamond green lines only via pseudo-elements */
.rc-tl::before,.rc-tr::before,.rc-bl::before,.rc-br::before,
.rc-tl::after,.rc-tr::after,.rc-bl::after,.rc-br::after {
    content:''; position:absolute; background:#00ff88;
    box-shadow:0 0 10px #00ff88, 0 0 24px rgba(0,255,150,0.9), 0 0 40px rgba(0,255,130,0.4);
}
/* Horizontal bar */
.rc-tl::before { top:0; left:0; width:100%; height:2.5px; }
.rc-tr::before { top:0; right:0; width:100%; height:2.5px; }
.rc-bl::before { bottom:0; left:0; width:100%; height:2.5px; }
.rc-br::before { bottom:0; right:0; width:100%; height:2.5px; }
/* Vertical bar */
.rc-tl::after  { top:0; left:0; width:2.5px; height:100%; }
.rc-tr::after  { top:0; right:0; width:2.5px; height:100%; }
.rc-bl::after  { bottom:0; left:0; width:2.5px; height:100%; }
.rc-br::after  { bottom:0; right:0; width:2.5px; height:100%; }

/* Katana slashes inside showcase */
.katana { position:absolute; background:#fff; z-index:15; opacity:0;
    box-shadow:0 0 15px #fff,0 0 30px var(--lime),0 0 45px #fff; border-radius:50%;
    filter:drop-shadow(0 0 10px var(--lime)); }
#k1 { width:180%;height:3px;top:50%;left:-40%;transform:rotate(35deg) translateX(-100%); }
#k2 { width:180%;height:3px;top:50%;left:-40%;transform:rotate(-35deg) translateX(100%); }
@keyframes kslash1{0%{transform:rotate(35deg) translateX(-100%);opacity:1;height:1px;}50%{opacity:1;height:5px;background:var(--white);}100%{transform:rotate(35deg) translateX(100%);opacity:0;height:1px;}}
@keyframes kslash2{0%{transform:rotate(-35deg) translateX(100%);opacity:1;height:1px;}50%{opacity:1;height:5px;background:var(--white);}100%{transform:rotate(-35deg) translateX(-100%);opacity:0;height:1px;}}

#resultCanvas { position:absolute; inset:0; pointer-events:none; z-index:4; }

/* Circle glow ring behind number */
.ring-wrap {
    position:relative; width:95px; height:95px;
    display:flex; align-items:center; justify-content:center; z-index:6;
}
.ring-wrap::before {
    content:''; position:absolute; width:132px; height:132px; border-radius:50%;
    background:radial-gradient(circle, rgba(0,180,255,0.12) 0%, rgba(0,80,120,0.06) 45%, transparent 70%);
    border:1px solid rgba(0,255,180,0.08);
}

.holo-ring {
    position:absolute; width:88px; height:88px; border-radius:50%;
    border:1.5px dashed rgba(0,220,255,0.55);
    animation:spinA 6s linear infinite;
    box-shadow:0 0 12px rgba(0,200,255,0.3);
}
.holo-ring-2 {
    position:absolute; width:108px; height:108px; border-radius:50%;
    border:1px solid rgba(0,180,255,0.25);
    animation:spinA 9s linear infinite reverse;
}

.holo-card {
    position:relative; z-index:6; width:82px; height:82px;
    display:flex; align-items:center; justify-content:center;

    /* Deep black base */
    background:
        radial-gradient(circle at 40% 30%, rgba(0,20,40,0.98) 0%, #000508 60%, #000002 100%);

    /* Neon Blue multi-border layers */
    border:2.5px solid #00E5FF;
    border-top:2.5px solid rgba(255,255,255,0.85);
    border-left:2px solid rgba(100,240,255,0.6);
    border-radius:4px;

    box-shadow:
        /* outer neon pulse */
        0 0 12px #00E5FF,
        0 0 28px rgba(0,220,255,0.8),
        0 0 55px rgba(0,180,255,0.45),
        0 0 90px rgba(0,140,255,0.2),
        /* inner fill */
        inset 0 0 22px rgba(0,200,255,0.1),
        inset 0 0 8px rgba(0,230,255,0.06),
        inset 0 1px 0 rgba(255,255,255,0.3),
        inset 0 -1px 0 rgba(0,200,255,0.2);
}

/* Corner cut decoration on number box */
.holo-card::before {
    content:'';
    position:absolute; inset:-1px;
    border-radius:4px;
    background:transparent;
    border:1px solid rgba(0,255,220,0.25);
    pointer-events:none;
}
/* Inner scan line */
.holo-card::after {
    content:'';
    position:absolute; left:4px; right:4px; height:1px;
    top:50%; transform:translateY(-50%);
    background:linear-gradient(90deg,transparent,rgba(0,230,255,0.4),transparent);
    pointer-events:none;
    animation:cardScan 2.5s ease-in-out infinite;
}
@keyframes cardScan {
    0%,100%{ top:20%; opacity:0.6; }
    50%    { top:80%; opacity:0.3; }
}
.holo-card span {
    font-family:'Orbitron',sans-serif; font-size:30px; font-weight:900;
    color:#00F0FF;
    text-shadow:
        0 0 6px #fff,
        0 0 14px #00F0FF,
        0 0 28px #80F8FF,
        0 0 55px rgba(0,230,255,0.7),
        0 0 90px rgba(0,180,255,0.4);
}

.spin-reveal { animation:ultraSpin 3.5s cubic-bezier(0.2,0.8,0.2,1) forwards; }
@keyframes ultraSpin {
    0%  {transform:rotateY(0deg) scale(0.5);opacity:0;filter:brightness(2.5);}
    15% {transform:rotateY(720deg) scale(1.3);opacity:1;filter:brightness(2);box-shadow:0 0 55px #00E5FF;}
    85% {transform:rotateY(3600deg) scale(1.2);opacity:1;filter:brightness(1.5);box-shadow:0 0 55px #00E5FF;}
    100%{transform:rotateY(3960deg) scale(1);filter:brightness(1);box-shadow:0 0 22px rgba(0,200,255,0.7);}
}

/* SMALL label - inside showcase */
.sz-label {
    font-family:'Orbitron',sans-serif; font-size:14px; font-weight:700;
    letter-spacing:5px; color:#00F0FF; text-transform:uppercase;
    text-shadow:
        0 0 6px #fff,
        0 0 14px #00F0FF,
        0 0 28px #80F8FF,
        0 0 50px rgba(0,230,255,0.6);
    opacity:0; transition:opacity 0.3s ease; z-index:6; position:relative;
}
.sz-label.pop-in { animation:szPop 0.6s cubic-bezier(.2,1.6,.4,1) forwards; }
@keyframes szPop{0%{transform:scale(0.5);opacity:0;}60%{transform:scale(1.2);opacity:1;filter:brightness(1.5);}100%{transform:scale(1);opacity:1;}}

/* Period box - inside showcase */
.period-box {
    font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:3px;
    color:#e0fff4; z-index:6; position:relative;
    border:1px solid rgba(0,255,120,0.75);
    border-top:1px solid rgba(255,255,255,0.5);
    border-left:1px solid rgba(200,255,230,0.3);
    padding:3px 14px;
    background:linear-gradient(135deg, rgba(0,28,14,0.75) 0%, rgba(0,50,25,0.55) 100%);
    text-shadow:0 0 10px #00ffaa, 0 0 22px rgba(0,255,150,0.5);
    box-shadow:
        0 0 14px rgba(0,255,100,0.3),
        0 0 30px rgba(0,255,100,0.12),
        inset 0 1px 0 rgba(200,255,220,0.12);
}

/* ══════════════════════════════════════
   LOCK OVERLAY
══════════════════════════════════════ */
#lockOverlay {
    display:none; flex-direction:column; align-items:center; justify-content:center;
    padding:30px 10px; text-align:center; flex:1;
    position:relative; z-index:5;
}
#lockMsg { font-family:'Shojumaru',cursive; font-size:9px; color:var(--neon); margin-bottom:16px; line-height:1.9; text-shadow:0 0 12px var(--neon); }

/* ══════════════════════════════════════
   SHADOW CLONE RIFT ANIMATION SYSTEM
══════════════════════════════════════ */

/* Ghost Clone overlay canvas */
#riftCanvas { position:absolute; inset:0; pointer-events:none; z-index:50; }

/* Panel glitch on rift */
.panel.ninja-glitch {
    animation: panelGlitch 0.7s steps(1) forwards;
}
@keyframes panelGlitch {
    0%   { filter:brightness(1) hue-rotate(0deg); transform:translateX(0); }
    8%   { filter:brightness(3) hue-rotate(120deg) saturate(3); transform:translateX(-5px) skewX(-4deg); }
    16%  { filter:brightness(2) hue-rotate(240deg) saturate(2); transform:translateX(5px) skewX(3deg); }
    24%  { filter:brightness(4) hue-rotate(60deg) saturate(4); transform:translateX(-3px); }
    32%  { filter:brightness(1.5) hue-rotate(180deg); transform:translateX(3px) skewX(-1deg); }
    45%  { filter:brightness(2.5) hue-rotate(300deg) saturate(2); transform:translateX(-2px); }
    60%  { filter:brightness(1.8) hue-rotate(30deg); transform:translateX(2px); }
    75%  { filter:brightness(1.3) hue-rotate(0deg); transform:translateX(0); }
    100% { filter:brightness(1) hue-rotate(0deg); transform:translateX(0); }
}

/* Mega neon slash overlay for rift */
#riftSlash {
    position:absolute; inset:0; pointer-events:none; z-index:55; opacity:0;
}
#riftSlash.fire {
    animation: riftSlashAnim 0.5s ease-out forwards;
}
@keyframes riftSlashAnim {
    0%   { opacity:0; }
    10%  { opacity:1; }
    40%  { opacity:0.8; }
    100% { opacity:0; }
}

/* Smoke veil */
#riftSmoke {
    position:absolute; inset:0; pointer-events:none; z-index:52;
    background:radial-gradient(ellipse at 50% 50%,
        rgba(0,255,100,0.25) 0%,
        rgba(0,180,255,0.15) 30%,
        rgba(150,0,255,0.1) 60%,
        transparent 80%);
    opacity:0; filter:blur(8px);
}
#riftSmoke.fire { animation: smokeAnim 1.2s ease-out forwards; }
@keyframes smokeAnim {
    0%   { opacity:0;   transform:scale(0.5) rotate(-5deg); filter:blur(4px); }
    20%  { opacity:0.9; transform:scale(1.3) rotate(2deg);  filter:blur(12px); }
    60%  { opacity:0.6; transform:scale(1.6) rotate(-3deg); filter:blur(18px); }
    100% { opacity:0;   transform:scale(2.2) rotate(5deg);  filter:blur(30px); }
}

/* ══════════════════════════════════════
   CYBER SHINOBI SCAN LINE
══════════════════════════════════════ */
#cyberScanner {
    position:absolute; left:0; right:0; height:3px;
    top:-3px; pointer-events:none; z-index:30; opacity:0;
    background:linear-gradient(90deg,
        transparent 0%,
        rgba(0,255,100,0.3) 10%,
        rgba(0,255,120,0.8) 30%,
        #00ff88 50%,
        rgba(180,255,220,1) 52%,
        #00ff88 54%,
        rgba(0,255,120,0.8) 70%,
        rgba(0,255,100,0.3) 90%,
        transparent 100%);
    box-shadow:
        0 0 8px #00ff88,
        0 0 20px rgba(0,255,140,0.7),
        0 0 40px rgba(0,255,120,0.3),
        0 2px 12px rgba(0,255,100,0.4);
    filter:blur(0.3px);
}
/* The glow trail below scanner */
#cyberScanner::after {
    content:'';
    position:absolute; left:0; right:0; top:0; height:40px;

        rgba(0,255,120,0.12) 0%,

}
#cyberScanner.scanning {

}

    4%   { opacity:1; }
    90%  { opacity:0.8; }
    100% { top:calc(100% + 3px); opacity:0; }
}

/* Scanner grid overlay during scan */

}

<script>
/* ══════════════════════════════════════════
   BACKGROUND CANVAS (Heavy Green Slashes)
══════════════════════════════════════════ */
(function(){
    var c=document.getElementById('bgCanvas');
    if(!c) return;
    function rsz(){ c.width=innerWidth; c.height=innerHeight; }
    rsz(); window.addEventListener('resize',rsz);
    var ctx=c.getContext('2d'); var pool=[];
    function Slash(){ this.spawn(); }
    Slash.prototype.spawn=function(){
        this.x = Math.random()*c.width; this.y = Math.random()*c.height;
        var ang = (-40 + Math.random()*28)*Math.PI/180; var spd = 7 + Math.random()*14;
        this.vx = Math.cos(ang)*spd; this.vy = Math.sin(ang)*spd;
        this.life = 1; this.decay = 0.03 + Math.random()*0.06; this.w = 0.8 + Math.random()*1.8;
        this.col = 'rgba(57,255,20,'; /* GREEN! */
        this.trail=[];
    };
    Slash.prototype.draw=function(){
        if(this.life<=0){ this.spawn(); return; }
        this.trail.push({x:this.x,y:this.y}); if(this.trail.length>10) this.trail.shift();
        for(var i=1;i<this.trail.length;i++){
            var a=(i/this.trail.length)*this.life*0.7;
            ctx.beginPath(); ctx.strokeStyle=this.col+a+')'; ctx.lineWidth=this.w*(i/this.trail.length);
            ctx.shadowColor=this.col+'1)'; ctx.shadowBlur=12;
            ctx.moveTo(this.trail[i-1].x,this.trail[i-1].y); ctx.lineTo(this.trail[i].x,this.trail[i].y); ctx.stroke();
        }
        this.x+=this.vx; this.y+=this.vy; this.life-=this.decay;
    };
    for(var i=0;i<8;i++){ var s=new Slash(); s.life=Math.random()*0.8; pool.push(s); }
    function loop(){ 
        ctx.clearRect(0,0,c.width,c.height); 
        
        // ── MATRIX GRID LINES ──
        ctx.save();
        var t = Date.now() * 0.0008;
        var gsp = 38;
        // Vertical lines
        for(var gx=0; gx<c.width; gx+=gsp){
            var va = 0.04 + 0.02*Math.abs(Math.sin(t + gx*0.05));
            ctx.strokeStyle='rgba(57,255,20,'+va+')';
            ctx.lineWidth=0.5;
            ctx.shadowColor='rgba(57,255,20,0.3)'; ctx.shadowBlur=4;
            ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,c.height); ctx.stroke();
        }
        // Horizontal lines
        for(var gy=0; gy<c.height; gy+=gsp){
            var ha = 0.04 + 0.02*Math.abs(Math.sin(t + gy*0.05));
            ctx.strokeStyle='rgba(57,255,20,'+ha+')';
            ctx.lineWidth=0.5;
            ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(c.width,gy); ctx.stroke();
        }
        // Diagonal accent lines (matrix feel)
        for(var d=0; d<3; d++){
            var dx = (c.width*0.25*d + t*18)%(c.width+c.height);
            var da = 0.06 + 0.04*Math.sin(t*2+d);
            ctx.strokeStyle='rgba(57,255,20,'+da+')';
            ctx.lineWidth=0.8;
            ctx.beginPath(); ctx.moveTo(dx-c.height,0); ctx.lineTo(dx,c.height); ctx.stroke();
        }
        ctx.shadowBlur=0; ctx.restore();

        pool.forEach(function(s){ s.draw(); }); 
        requestAnimationFrame(loop); 
    }
    loop();
})();

/* ══════════════════════════════════════════
   PANEL CANVAS: COLLIDING SHURIKENS & SPARKS
══════════════════════════════════════════ */
(function(){
    var pc=document.getElementById('panelCanvas');
    if(!pc) return;
    function rsz(){ 
        var p=pc.parentElement; 
        if (p) {
            pc.width=p.offsetWidth||270; 
            pc.height=p.offsetHeight||430; 
        } else {
            pc.width=270;
            pc.height=430;
        }
    }
    setTimeout(rsz,120);
    var ctx=pc.getContext('2d');
    if(!ctx) return;
    
    var shurikens=[]; var sparks=[];

    function Shuriken(){
        this.r = 6 + Math.random()*3;
        this.x = this.r + Math.random()*(270 - this.r*2);
        this.y = this.r + Math.random()*(430 - this.r*2);
        var ang = Math.random()*Math.PI*2; var spd = 0.8 + Math.random()*1.5;
        this.vx = Math.cos(ang)*spd; this.vy = Math.sin(ang)*spd;
        this.angle = 0; this.va = 0.1 + Math.random()*0.2;
    }
    
    function Spark(x,y){
        this.x=x; this.y=y;
        var ang=Math.random()*Math.PI*2; var spd=1+Math.random()*3;
        this.vx=Math.cos(ang)*spd; this.vy=Math.sin(ang)*spd;
        this.life=1; this.decay=0.05+Math.random()*0.1;
    }

    for(var i=0; i<6; i++) shurikens.push(new Shuriken());

    function drawShuriken(s) {
        ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.angle);
        var size = s.r;

        // ── 4-blade realistic shuriken ──
        for(var b = 0; b < 4; b++){
            ctx.save(); ctx.rotate(b * Math.PI / 2);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(size*0.55, -size*0.18, 0, -size*1.05);
            ctx.quadraticCurveTo(-size*0.55, -size*0.18, 0, 0);

            // Metallic blade gradient per blade
            var bladeGrad = ctx.createLinearGradient(-size*0.5, -size, size*0.5, 0);
            bladeGrad.addColorStop(0,   'rgba(240,240,255,0.95)'); // bright edge
            bladeGrad.addColorStop(0.18,'rgba(180,185,200,0.9)');  // steel highlight
            bladeGrad.addColorStop(0.45,'rgba(100,105,120,0.85)'); // mid steel
            bladeGrad.addColorStop(0.72,'rgba(55,58,70,0.9)');     // shadow
            bladeGrad.addColorStop(1,   'rgba(28,30,38,0.95)');    // dark edge
            ctx.fillStyle = bladeGrad;
            ctx.shadowColor = 'rgba(150,160,210,0.55)';
            ctx.shadowBlur  = 14;
            ctx.fill();

            // Sharp edge stroke
            ctx.strokeStyle = 'rgba(220,225,245,0.65)';
            ctx.lineWidth = 0.4;
            ctx.stroke();
            ctx.restore();
        }

        // Center hub – polished steel disc
        var hubGrad = ctx.createRadialGradient(-size*0.12, -size*0.12, 0, 0, 0, size*0.42);
        hubGrad.addColorStop(0,   '#e0e4f0');
        hubGrad.addColorStop(0.3, '#a8afc4');
        hubGrad.addColorStop(0.65,'#585e74');
        hubGrad.addColorStop(1,   '#22242e');
        ctx.beginPath(); ctx.arc(0, 0, size*0.42, 0, Math.PI*2);
        ctx.fillStyle = hubGrad;
        ctx.shadowColor = 'rgba(100,110,180,0.5)';
        ctx.shadowBlur  = 8;
        ctx.fill();

        // Hub rim
        ctx.beginPath(); ctx.arc(0, 0, size*0.42, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(210,215,240,0.75)';
        ctx.lineWidth = 0.7;
        ctx.shadowBlur = 0;
        ctx.stroke();

        // Inner ring detail
        ctx.beginPath(); ctx.arc(0, 0, size*0.22, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(180,185,210,0.5)';
        ctx.lineWidth = 0.5;
        ctx.stroke();

        // Specular glint (top-left)
        var spec = ctx.createRadialGradient(-size*0.14,-size*0.18, 0, -size*0.14,-size*0.18, size*0.28);
        spec.addColorStop(0, 'rgba(255,255,255,0.82)');
        spec.addColorStop(0.5,'rgba(255,255,255,0.18)');
        spec.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.beginPath(); ctx.arc(-size*0.14, -size*0.18, size*0.28, 0, Math.PI*2);
        ctx.fillStyle = spec; ctx.fill();

        ctx.restore();
    }

    function loop(){
        ctx.clearRect(0,0,pc.width,pc.height);
        var w = pc.width||270; var h = pc.height||430;

        // Move and draw shurikens
        for(var i=0; i<shurikens.length; i++){
            var s = shurikens[i];
            s.x += s.vx; s.y += s.vy; s.angle += s.va;
            
            // Wall bounce
            if(s.x < s.r) { s.x = s.r; s.vx *= -1; } else if(s.x > w - s.r) { s.x = w - s.r; s.vx *= -1; }
            if(s.y < s.r) { s.y = s.r; s.vy *= -1; } else if(s.y > h - s.r) { s.y = h - s.r; s.vy *= -1; }

            // Collisions (Takkar)
            for(var j=i+1; j<shurikens.length; j++){
                var s2 = shurikens[j];
                var dx = s.x - s2.x; var dy = s.y - s2.y;
                var dist = Math.sqrt(dx*dx + dy*dy);
                var minDist = s.r + s2.r;
                if(dist < minDist){
                    // Bounce math
                    var overlap = minDist - dist; var nx = dx/dist; var ny = dy/dist;
                    s.x += nx * overlap/2; s.y += ny * overlap/2;
                    s2.x -= nx * overlap/2; s2.y -= ny * overlap/2;
                    var tvx = s.vx; var tvy = s.vy;
                    s.vx = s2.vx; s.vy = s2.vy; s2.vx = tvx; s2.vy = tvy;
                    // Create Sparks on collision
                    for(var k=0; k<5; k++) sparks.push(new Spark((s.x+s2.x)/2, (s.y+s2.y)/2));
                }
            }
            drawShuriken(s);
        }

        // Draw Sparks
        for(var i=sparks.length-1; i>=0; i--){
            var p = sparks[i];
            p.x += p.vx; p.y += p.vy; p.life -= p.decay;
            if(p.life <= 0) { sparks.splice(i,1); continue; }
            ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(57,255,20,'+p.life+')'; ctx.shadowBlur = 8; ctx.shadowColor = '#39ff14'; ctx.fill();
        }
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
})();

        }

        // 5. Ghost clone particles on riftCanvas
        var ghosts = [];
        var cx = W/2, cy = H/2;
        var colors = ['rgba(0,255,120,', 'rgba(0,200,255,', 'rgba(180,0,255,', 'rgba(255,200,0,'];
        for(var i = 0; i < 12; i++){
            var ang = (Math.random() * Math.PI * 2);
            var spd = 3 + Math.random() * 6;
            ghosts.push({
                x: cx, y: cy,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd,
                life: 1,
                decay: 0.03 + Math.random() * 0.04,
                r: 8 + Math.random() * 18,
                col: colors[Math.floor(Math.random() * colors.length)],
                rot: Math.random() * Math.PI * 2,
                rv: (Math.random() - 0.5) * 0.3
            });
        }

        // 6. Clone streaks — ninja dash lines
        var streaks = [];
        for(var s = 0; s < 8; s++){
            var side = s % 2 === 0 ? -1 : 1;
            streaks.push({
                x: cx, y: cy,
                tx: cx + side * (40 + Math.random() * 80),
                ty: cy + (Math.random() - 0.5) * 60,
                life: 1,
                decay: 0.06 + Math.random() * 0.06,
                w: 1 + Math.random() * 3,
                col: colors[Math.floor(Math.random() * colors.length)]
            });
        }

        var active = true;
        function riftLoop(){
            if(!active) return;
            ctx.clearRect(0, 0, W, H);

            var anyAlive = false;

            // Draw streaks
            streaks.forEach(function(st){
                if(st.life <= 0) return;
                anyAlive = true;
                st.life -= st.decay;
                ctx.beginPath();
                ctx.moveTo(st.x, st.y);
                ctx.lineTo(st.tx, st.ty);
                ctx.strokeStyle = st.col + (st.life * 0.9) + ')';
                ctx.lineWidth = st.w;
                ctx.shadowColor = st.col + '1)';
                ctx.shadowBlur = 14;
                ctx.stroke();
            });

            // Draw ghost shurikens
            ghosts.forEach(function(g){
                if(g.life <= 0) return;
                anyAlive = true;
                g.x += g.vx; g.y += g.vy;
                g.vx *= 0.92; g.vy *= 0.92;
                g.life -= g.decay;
                g.rot += g.rv;

                ctx.save();
                ctx.translate(g.x, g.y);
                ctx.rotate(g.rot);
                ctx.globalAlpha = g.life * 0.85;

                // Draw mini shuriken ghost – grey metallic blades
                var r = g.r;
                ctx.shadowColor = 'rgba(160,170,220,0.8)';
                ctx.shadowBlur = 16;
                for(var b=0; b<4; b++){
                    ctx.save(); ctx.rotate(b * Math.PI/2);
                    ctx.beginPath();
                    ctx.moveTo(0,0);
                    ctx.quadraticCurveTo(r*0.5,-r*0.18,0,-r);
                    ctx.quadraticCurveTo(-r*0.5,-r*0.18,0,0);
                    var bg2 = ctx.createLinearGradient(-r*0.4,-r,r*0.4,0);
                    bg2.addColorStop(0,'rgba(230,235,255,'+g.life*0.9+')');
                    bg2.addColorStop(0.4,'rgba(140,148,175,'+g.life*0.8+')');
                    bg2.addColorStop(1,'rgba(40,42,55,'+g.life*0.7+')');
                    ctx.fillStyle = bg2;
                    ctx.fill(); ctx.restore();
                }
                // Hub
                var hg2 = ctx.createRadialGradient(-r*0.15,-r*0.15,0,0,0,r*0.38);
                hg2.addColorStop(0,'rgba(220,225,245,'+g.life+')');
                hg2.addColorStop(0.5,'rgba(100,108,130,'+g.life*0.9+')');
                hg2.addColorStop(1,'rgba(25,27,35,'+g.life*0.8+')');
                ctx.beginPath(); ctx.arc(0,0,r*0.38,0,Math.PI*2);
                ctx.fillStyle = hg2; ctx.shadowBlur=4; ctx.fill();

                ctx.restore();
            });

            if(anyAlive){
                requestAnimationFrame(riftLoop);
            } else {
                ctx.clearRect(0, 0, W, H);
                active = false;
            }
        }
        requestAnimationFrame(riftLoop);
    };
})();

function animateResult(){
    var rc=document.getElementById('resultCanvas'); if(!rc||!resultCtx){ resultAnim=false; return; }

        resultCtx.beginPath(); resultCtx.arc(p.x,p.y,p.r,0,Math.PI*2); resultCtx.fillStyle=p.col+p.life.toFixed(2)+')'; resultCtx.shadowColor=p.col+'1)'; resultCtx.shadowBlur=12; resultCtx.fill();

    var s=utc.getSeconds(); var sl=60-s;
    var cd=document.getElementById('countdown'); var cdb=document.getElementById('cdBar'); var cdf=document.getElementById('cdFill');
    if(cd){ cd.textContent='00:'+pad(sl); cd.classList.remove('warn','crit'); if(cdb) cdb.classList.remove('warn','crit'); if(sl<=5){ cd.classList.add('crit'); if(cdb) cdb.classList.add('crit'); } else if(sl<=15){ cd.classList.add('warn'); if(cdb) cdb.classList.add('warn'); } if(cdf) cdf.style.width=((sl/60)*100)+'%'; }
    var cp=getP(); var pid=document.getElementById('periodId'); if(pid) pid.innerText='#'+cp.slice(-4);
    if(state==='wingo'&&!resStore[cp]){ generatePred(cp); }
},1000);
</script>
